<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laptop Price Predictor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
            color: #222;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d7dce2;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #2874f0;
            box-shadow: 0 0 0 3px rgba(40, 116, 240, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2874f0;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1667df;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #eaf2ff;
            border: 1px solid #bfd5ff;
            text-align: center;
        }

        .result p {
            color: #555;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .result h2 {
            color: #1667df;
            font-size: 28px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Laptop Price Predictor</h1>
            <p>Enter laptop specifications to predict its estimated price</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="RAM">RAM (GB)</label>
                <input
                    type="number"
                    id="RAM"
                    name="RAM"
                    placeholder="Example: 16"
                    min="1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="Brand">Brand</label>
                <input
                    type="text"
                    id="Brand"
                    name="Brand"
                    placeholder="Example: Apple"
                    required
                >
            </div>

            <div class="form-group">
                <label for="Processor">Processor</label>
                <input
                    type="text"
                    id="Processor"
                    name="Processor"
                    placeholder="Example: M2"
                    required
                >
            </div>

            <div class="form-group">
                <label for="Storage">Storage (GB)</label>
                <input
                    type="number"
                    id="Storage"
                    name="Storage"
                    placeholder="Example: 1024"
                    min="1"
                    required
                >
            </div>

            <button type="submit">
                Predict Laptop Price
            </button>
        </form>

        {% if result %}
        <div class="result">
            <p>Estimated Laptop Price</p>
            <h2>₹{{ result|floatformat:2 }}</h2>
        </div>
        {% endif %}

    </div>

</body>
</html>
